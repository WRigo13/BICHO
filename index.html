<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#2563eb"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Jogo do Bicho</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #1d4ed8; font-family: 'Segoe UI', system-ui, sans-serif; color: #1e3a5f; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    button { font-family: inherit; cursor: pointer; }
    button:active { opacity: 0.85; }

    #app {
      display: flex; flex-direction: column;
      height: 100dvh; max-width: 430px;
      margin: 0 auto; background: #f0f6ff;
      overflow: hidden; position: relative;
    }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      padding: 14px 18px 12px; flex-shrink: 0;
      position: relative; overflow: hidden;
    }
    .bolha {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.15); pointer-events: none;
    }
    .header-inner { position: relative; display: flex; justify-content: space-between; align-items: center; }
    .header-titulo { font-size: 18px; font-weight: 800; color: #fff; }
    .header-sub { font-size: 9px; color: rgba(255,255,255,0.6); letter-spacing: 2px; margin-top: 2px; }
    .saldo-box {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px; padding: 6px 14px; text-align: center;
    }
    .saldo-label { font-size: 9px; color: rgba(255,255,255,0.6); letter-spacing: 1px; }
    .saldo-valor { font-size: 17px; font-weight: 800; color: #fff; }
    .saldo-baixo { color: #fca5a5 !important; }

    /* ── SCROLL ── */
    #content { flex: 1; overflow-y: auto; padding: 14px 14px 80px; }

    /* ── CARDS ── */
    .card {
      background: #fff; border-radius: 14px; padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(37,99,235,0.07);
      border: 1px solid #bfdbfe;
    }
    .label {
      font-size: 10px; font-weight: 700; color: #6b8caa;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px;
    }
    .input {
      width: 100%; padding: 12px 13px; border-radius: 10px;
      border: 2px solid #bfdbfe; font-size: 14px;
      color: #1e3a5f; background: #f8fbff; outline: none;
      font-family: inherit;
    }
    .input:focus { border-color: #2563eb; }

    /* ── MODALIDADE ── */
    .mod-sel {
      display: flex; justify-content: space-between; align-items: center;
      background: #dbeafe; border: 2px solid #2563eb;
      border-radius: 10px; padding: 12px 14px; cursor: pointer;
      width: 100%; text-align: left; margin-bottom: 4px;
    }
    .mod-sel-nome { font-weight: 700; font-size: 15px; color: #1e3a5f; }
    .mod-sel-desc { font-size: 11px; color: #6b8caa; margin-top: 2px; }
    .mod-sel-arrow { color: #2563eb; font-size: 14px; }
    .mod-opt {
      display: flex; justify-content: space-between; align-items: center;
      background: #f8fbff; border: 2px solid #bfdbfe;
      border-radius: 10px; padding: 10px 14px; cursor: pointer;
      width: 100%; text-align: left; margin-top: 6px;
    }
    .mod-opt-nome { font-weight: 600; font-size: 14px; color: #1e3a5f; }
    .mod-opt-desc { font-size: 11px; color: #6b8caa; }
    .mult-badge {
      background: #bfdbfe; color: #1d4ed8;
      border-radius: 8px; padding: 4px 10px;
      font-weight: 800; font-size: 13px; flex-shrink: 0;
    }

    /* ── GRADE ANIMAIS ── */
    .animal-sel {
      display: flex; align-items: center; gap: 10px;
      background: #dbeafe; border: 2px solid #2563eb;
      border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
    }
    .animal-sel-nome { font-weight: 700; color: #1e3a5f; }
    .animal-sel-dez { font-size: 11px; color: #6b8caa; margin-top: 2px; }
    .grade {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px;
    }
    .animal-card {
      border: 2px solid #bfdbfe; border-radius: 10px;
      padding: 7px 3px; cursor: pointer; text-align: center;
      background: #fff; position: relative; transition: all 0.1s;
    }
    .animal-card.selecionado {
      border: 3px solid #1d4ed8; background: #dbeafe;
    }
    .animal-card-emoji { font-size: 24px; display: block; }
    .animal-card-nome { font-size: 8px; font-weight: 700; color: #1e3a5f; margin-top: 2px; line-height: 1.2; }
    .animal-card-dez { font-size: 7px; color: #6b8caa; }
    .check-badge {
      position: absolute; top: 2px; right: 2px;
      background: #1d4ed8; color: #fff; border-radius: 50%;
      width: 14px; height: 14px; font-size: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold;
    }

    /* ── ANIMAL DETECTADO ── */
    .animal-preview { text-align: center; margin-top: 12px; }
    .animal-preview-emoji { font-size: 42px; display: block; }
    .animal-preview-nome { font-weight: 700; color: #2563eb; font-size: 16px; margin-top: 4px; }

    /* ── VALOR ── */
    .vals-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; margin-bottom: 8px; }
    .val-btn {
      padding: 10px 4px; border-radius: 10px;
      border: 2px solid #bfdbfe; background: #f8fbff;
      color: #1e3a5f; font-weight: 700; font-size: 14px;
    }
    .val-btn.ativo { background: #2563eb; border-color: #2563eb; color: #fff; }
    .premio-box {
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      border-radius: 10px; padding: 12px; text-align: center; margin-top: 10px;
    }
    .premio-label { font-size: 10px; color: #6b8caa; }
    .premio-valor { font-size: 24px; font-weight: 800; color: #1d4ed8; }
    .erro-saldo { color: #dc2626; text-align: center; margin-top: 8px; font-size: 13px; }

    /* ── BOTÃO PRINCIPAL ── */
    .btn-primary {
      width: 100%; padding: 16px; border-radius: 14px; border: none;
      font-size: 17px; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 6px 20px rgba(37,99,235,0.4);
      letter-spacing: 0.5px;
    }
    .btn-primary:disabled {
      background: #c7d8f0; color: #8aaccc;
      box-shadow: none; cursor: not-allowed;
    }

    /* ── SORTEANDO ── */
    #tela-sorteando {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 65vh; gap: 20px;
    }
    .spin-emoji { font-size: 60px; animation: spin 0.8s linear infinite; display: inline-block; }
    .sorteando-txt { font-size: 20px; font-weight: 800; color: #2563eb; }
    .bolas-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .bola {
      width: 64px; border-radius: 14px; padding: 10px 5px;
      border: 2px dashed #bfdbfe; background: #f8fbff;
      text-align: center; transition: all 0.4s;
    }
    .bola.ativa { border-style: solid; border-color: #2563eb; background: #dbeafe; }
    .bola-emoji { font-size: 26px; display: block; }
    .bola-num { font-size: 13px; font-weight: 800; color: #2563eb; margin-top: 2px; display: block; }
    .bola-premio { font-size: 8px; color: #6b8caa; display: block; }
    .bola-q { font-size: 26px; color: #bfdbfe; line-height: 56px; display: block; }

    /* ── RESULTADO ── */
    .res-header {
      border-radius: 16px; padding: 22px 16px;
      text-align: center; margin-bottom: 12px;
      border: 2px solid;
    }
    .res-header.ganhou { background: linear-gradient(135deg,#dcfce7,#bbf7d0); border-color: #4ade80; }
    .res-header.perdeu { background: linear-gradient(135deg,#fee2e2,#fecaca); border-color: #f87171; }
    .res-icon { font-size: 60px; margin-bottom: 6px; display: block; }
    .res-titulo { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .res-premio { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
    .res-saldo { font-size: 12px; opacity: 0.7; }

    .bolas-res { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; }
    .bola-res {
      width: 66px; border-radius: 12px; padding: 9px 5px;
      text-align: center; border: 2px solid #bfdbfe; background: #f8fbff;
    }
    .bola-res.destaque {
      border: 3px solid #2563eb; background: #dbeafe;
      box-shadow: 0 4px 14px rgba(37,99,235,0.25);
    }
    .bola-res .bola-num-res { color: #1e3a5f; }
    .bola-res.destaque .bola-num-res { color: #2563eb; }

    .resumo-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
    .resumo-key { color: #6b8caa; }
    .resumo-val { font-weight: 700; color: #1e3a5f; }

    /* ── BICHOS ── */
    .grade-bichos { display: grid; grid-template-columns: repeat(5,1fr); gap: 7px; margin-bottom: 20px; }
    .bicho-card { background: #fff; border-radius: 12px; padding: 10px 4px; text-align: center; border: 1px solid #bfdbfe; }
    .bicho-emoji { font-size: 24px; display: block; }
    .bicho-nome { font-size: 8px; font-weight: 700; color: #1e3a5f; margin-top: 3px; line-height: 1.2; }
    .bicho-grupo { font-size: 7px; color: #6b8caa; margin-top: 1px; }
    .bicho-dezenas { margin-top: 5px; display: flex; flex-direction: column; gap: 2px; }
    .dez-badge { background: #dbeafe; border-radius: 3px; text-align: center; font-size: 8px; font-weight: 700; color: #1d4ed8; padding: 1px 0; }

    .mod-card {
      background: #fff; border-radius: 14px; padding: 14px 16px;
      margin-bottom: 8px; display: flex; justify-content: space-between;
      align-items: center; border: 1px solid #bfdbfe;
    }
    .mod-card-nome { font-weight: 700; font-size: 14px; color: #1e3a5f; }
    .mod-card-desc { font-size: 11px; color: #6b8caa; margin-top: 2px; }
    .mult-box { background: #dbeafe; border-radius: 10px; padding: 6px 14px; text-align: center; }
    .mult-paga { font-size: 9px; color: #6b8caa; display: block; }
    .mult-val { font-size: 17px; font-weight: 800; color: #1d4ed8; display: block; }

    /* ── HISTÓRICO ── */
    .hist-card {
      background: #fff; border-radius: 14px; padding: 12px 14px;
      margin-bottom: 8px; border: 1px solid #bfdbfe;
      border-left: 4px solid;
    }
    .hist-card.ganhou { border-left-color: #4ade80; }
    .hist-card.perdeu { border-left-color: #f87171; }
    .hist-row { display: flex; justify-content: space-between; align-items: center; }
    .hist-left { display: flex; gap: 8px; align-items: center; flex: 1; }
    .hist-mod { font-weight: 700; font-size: 13px; color: #1e3a5f; }
    .hist-nums { font-size: 10px; color: #6b8caa; margin-top: 2px; }
    .hist-right { text-align: right; flex-shrink: 0; margin-left: 8px; }
    .hist-valor { font-weight: 800; font-size: 14px; }
    .hist-apostado { font-size: 9px; color: #6b8caa; }

    .empty-hist { text-align: center; padding: 50px 20px; color: #6b8caa; }
    .empty-emoji { font-size: 44px; margin-bottom: 10px; display: block; }
    .empty-txt { font-weight: 700; margin-bottom: 12px; }

    /* ── BOTTOM NAV ── */
    #nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: #fff; border-top: 1px solid #bfdbfe;
      display: flex; box-shadow: 0 -4px 16px rgba(37,99,235,0.1);
      z-index: 50;
    }
    .nav-btn {
      flex: 1; background: none; border: none;
      border-top: 3px solid transparent;
      padding: 10px 8px 8px; display: flex;
      flex-direction: column; align-items: center; gap: 2px;
    }
    .nav-btn.ativo { border-top-color: #2563eb; }
    .nav-icon { font-size: 20px; }
    .nav-label { font-size: 10px; font-weight: 500; color: #6b8caa; }
    .nav-btn.ativo .nav-label { font-weight: 700; color: #2563eb; }

    .hidden { display: none !important; }
    .titulo-sec { font-weight: 800; font-size: 16px; color: #1e3a5f; margin-bottom: 12px; }
    .badge { background: #2563eb; color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 12px; margin-left: 6px; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="bolha" style="width:70px;height:70px;top:-20px;left:-10px"></div>
    <div class="bolha" style="width:50px;height:50px;top:5px;left:60px"></div>
    <div class="bolha" style="width:90px;height:90px;top:-30px;left:130px"></div>
    <div class="bolha" style="width:55px;height:55px;top:8px;left:230px"></div>
    <div class="bolha" style="width:80px;height:80px;top:-25px;left:310px"></div>
    <div class="bolha" style="width:45px;height:45px;top:10px;left:400px"></div>
    <div class="header-inner">
      <div>
        <div class="header-titulo">🎲 Jogo do Bicho</div>
        <div class="header-sub">LOTERIA FEDERAL</div>
      </div>
      <div class="saldo-box">
        <div class="saldo-label">SALDO</div>
        <div class="saldo-valor" id="saldo-txt">R$ 100,00</div>
      </div>
    </div>
  </div>

  <!-- CONTEÚDO -->
  <div id="content">

    <!-- TELA: APOSTAR FORM -->
    <div id="tela-form">

      <!-- Modalidade -->
      <div class="card">
        <div class="label">MODALIDADE</div>
        <button class="mod-sel" id="mod-sel-btn" onclick="toggleMod()">
          <div>
            <div class="mod-sel-nome" id="mod-nome">No Bicho</div>
            <div class="mod-sel-desc" id="mod-desc">Animal do 1º prêmio · <b style="color:#2563eb">×18</b></div>
          </div>
          <span class="mod-sel-arrow" id="mod-arrow">▼</span>
        </button>
        <div id="mod-opcoes" class="hidden"></div>
      </div>

      <!-- Grade animais -->
      <div class="card" id="card-animais">
        <div class="label">ESCOLHA O ANIMAL</div>
        <div id="animal-selecionado" class="hidden animal-sel">
          <span id="animal-sel-emoji" style="font-size:30px"></span>
          <div style="flex:1;margin-left:10px">
            <div class="animal-sel-nome" id="animal-sel-nome"></div>
            <div class="animal-sel-dez" id="animal-sel-dez"></div>
          </div>
          <button onclick="limparAnimal()" style="background:none;border:none;font-size:20px;color:#6b8caa;cursor:pointer">✕</button>
        </div>
        <input class="input" id="filtro-input" placeholder="🔍 Buscar animal..." oninput="renderGrade()" style="margin-bottom:10px"/>
        <div class="grade" id="grade-animais"></div>
      </div>

      <!-- Campo numérico -->
      <div class="card hidden" id="card-numero">
        <div class="label" id="num-label">DEZENA (00–99)</div>
        <input class="input" id="num-input" type="number" inputmode="numeric" placeholder="Ex: 42"
          style="font-size:26px;text-align:center" oninput="onNumInput()"/>
        <div id="animal-preview" class="animal-preview hidden">
          <span class="animal-preview-emoji" id="preview-emoji"></span>
          <div class="animal-preview-nome" id="preview-nome"></div>
        </div>
      </div>

      <!-- Valor -->
      <div class="card">
        <div class="label">VALOR DA APOSTA</div>
        <div class="vals-grid" id="vals-grid"></div>
        <input class="input" id="valor-input" type="number" inputmode="numeric"
          value="10" placeholder="Outro valor..." style="font-size:18px;text-align:center"
          oninput="atualizarPremio()"/>
        <div id="premio-box" class="premio-box hidden">
          <div class="premio-label">POSSÍVEL PRÊMIO</div>
          <div class="premio-valor" id="premio-txt"></div>
        </div>
        <div id="erro-saldo" class="erro-saldo hidden">Saldo insuficiente</div>
      </div>

      <button class="btn-primary" id="btn-apostar" onclick="lancar()" disabled>
        Preencha os campos acima
      </button>
    </div><!-- fim tela-form -->

    <!-- TELA: SORTEANDO -->
    <div id="tela-sorteando" class="hidden">
      <span class="spin-emoji">🎰</span>
      <div class="sorteando-txt">Sorteando...</div>
      <div class="bolas-row" id="bolas-container"></div>
    </div>

    <!-- TELA: RESULTADO -->
    <div id="tela-resultado" class="hidden">
      <div id="res-header" class="res-header">
        <span id="res-icon" class="res-icon"></span>
        <div id="res-titulo" class="res-titulo"></div>
        <div id="res-premio" class="res-premio hidden"></div>
        <div id="res-saldo" class="res-saldo"></div>
      </div>
      <div class="card">
        <div class="label">SORTEIO</div>
        <div class="bolas-res" id="bolas-res"></div>
      </div>
      <div class="card">
        <div class="label">RESUMO</div>
        <div id="resumo-rows"></div>
      </div>
      <button class="btn-primary" onclick="resetar()" style="margin-bottom:12px">🎲 Nova Aposta</button>
    </div>

    <!-- TELA: BICHOS -->
    <div id="tela-bichos" class="hidden">
      <div class="titulo-sec">🐾 Os 25 Bichos</div>
      <div class="grade-bichos" id="grade-bichos"></div>
      <div class="titulo-sec">💰 Multiplicadores</div>
      <div id="lista-mods"></div>
    </div>

    <!-- TELA: HISTÓRICO -->
    <div id="tela-historico" class="hidden">
      <div class="titulo-sec">📋 Histórico <span id="hist-badge" class="badge hidden"></span></div>
      <div id="lista-historico">
        <div class="card empty-hist">
          <span class="empty-emoji">🎲</span>
          <div class="empty-txt">Nenhuma aposta ainda</div>
          <button onclick="irApostar()" style="background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 22px;font-weight:700;font-size:14px">Apostar agora</button>
        </div>
      </div>
    </div>

  </div><!-- fim content -->

  <!-- BOTTOM NAV -->
  <div id="nav">
    <button class="nav-btn ativo" id="nav-apostar" onclick="setTab('apostar')">
      <span class="nav-icon">🎲</span><span class="nav-label">Apostar</span>
    </button>
    <button class="nav-btn" id="nav-bichos" onclick="setTab('bichos')">
      <span class="nav-icon">🐾</span><span class="nav-label">Bichos</span>
    </button>
    <button class="nav-btn" id="nav-historico" onclick="setTab('historico')">
      <span class="nav-icon">📋</span><span class="nav-label">Histórico</span>
    </button>
  </div>

</div><!-- fim app -->

<script>
// ─── DADOS ────────────────────────────────────────────────

  {id:19,nome:"Pavão",     dez:["73","74","75","76"], e:"🦚"},

const MODS = [
  {id:"bicho",   nome:"No Bicho",    mult:18,   desc:"Animal do 1º prêmio"},
  {id:"dezena",  nome:"Na Dezena",   mult:60,   desc:"2 últimos dígitos"},
  {id:"centena", nome:"Na Centena",  mult:600,  desc:"3 últimos dígitos"},
  {id:"milhar",  nome:"No Milhar",   mult:4000, desc:"4 dígitos exatos"},
  {id:"grupo",   nome:"Grupo de 5",  mult:3,    desc:"Animal em qualquer prêmio"},
];

const VALS = ["1","2","5","10","20","50","100"];

// ─── ESTADO ───────────────────────────────────────────────
let tab       = "apostar";
let saldo     = 100;
let modIdx    = 0;
let modOpen   = false;
let animal    = null;
let numInput  = "";
let valor     = "10";
let historico = [];

function byDez(d) { return ANIMAIS.find(a => a.dez.includes(d)); }

function sortear() {
  return Array.from({length:5}, () => String(Math.floor(Math.random()*10000)).padStart(4,"0"));
}

function checar(aposta, nums) {
  for (let i=0; i<nums.length; i++) {
    const n=nums[i], d=n.slice(-2);
    if (aposta.mod==="bicho"   && i===0 && byDez(d)?.id===aposta.animalId) return i;
    if (aposta.mod==="grupo"   && byDez(d)?.id===aposta.animalId)          return i;
    if (aposta.mod==="dezena"  && d===aposta.num.slice(-2))                 return i;
    if (aposta.mod==="centena" && n.slice(-3)===aposta.num.slice(-3))       return i;
    if (aposta.mod==="milhar"  && n===aposta.num)                           return i;
  }
  return -1;
}

// ─── HELPERS ──────────────────────────────────────────────
function $(id) { return document.getElementById(id); }
function show(id) { $(id).classList.remove('hidden'); }
function hide(id) { $(id).classList.add('hidden'); }
function toggle(id, cond) { cond ? show(id) : hide(id); }

function getMod() { return MODS[modIdx]; }
function getValor() { return parseFloat(valor) || 0; }

function numOk() {
  const mod = getMod();
  if (mod.id==="bicho"||mod.id==="grupo") return !!animal;
  if (mod.id==="dezena")  return numInput.length===2;
  if (mod.id==="centena") return numInput.length===3;
  if (mod.id==="milhar")  return numInput.length===4;
  return false;
}

function podeApostar() {
  const v = getValor();
  return v>0 && v<=saldo && numOk();
}

function atualizarSaldo() {
  $("saldo-txt").textContent = "R$ " + saldo.toFixed(2).replace('.', ',');
  if (saldo < 10) $("saldo-txt").classList.add('saldo-baixo');
  else $("saldo-txt").classList.remove('saldo-baixo');
}

// ─── MODALIDADE ───────────────────────────────────────────
function renderModInfo() {
  const mod = getMod();
  $("mod-nome").textContent = mod.nome;
  $("mod-desc").innerHTML   = mod.desc + ' · <b style="color:#2563eb">×' + mod.mult + '</b>';
  $("mod-arrow").textContent = modOpen ? "▲" : "▼";
}

function renderModOpcoes() {
  const el = $("mod-opcoes");
  el.innerHTML = "";
  MODS.forEach((m, i) => {
    if (i === modIdx) return;
    const btn = document.createElement("button");
    btn.className = "mod-opt";
    btn.innerHTML = `
      <div>
        <div class="mod-opt-nome">${m.nome}</div>
        <div class="mod-opt-desc">${m.desc}</div>
      </div>
      <span class="mult-badge">×${m.mult}</span>`;
    btn.onclick = () => { modIdx = i; modOpen = false; animal = null; numInput = ""; aplicarMod(); };
    el.appendChild(btn);
  });
}

function toggleMod() {
  modOpen = !modOpen;
  renderModInfo();
  renderModOpcoes();
  toggle("mod-opcoes", modOpen);
}

function aplicarMod() {
  const mod = getMod();
  renderModInfo();
  hide("mod-opcoes");
  modOpen = false;

  // grade animais
  const usaAnimal = mod.id==="bicho"||mod.id==="grupo";
  toggle("card-animais", usaAnimal);
  toggle("card-numero", !usaAnimal);

  if (!usaAnimal) {
    const maxLen = mod.id==="dezena"?2:mod.id==="centena"?3:4;
    const labels = {dezena:"DEZENA (00–99)", centena:"CENTENA (000–999)", milhar:"MILHAR (0000–9999)"};
    const placeholders = {dezena:"Ex: 42", centena:"Ex: 142", milhar:"Ex: 4231"};
    $("num-label").textContent   = labels[mod.id];
    $("num-input").placeholder   = placeholders[mod.id];
    $("num-input").maxLength     = maxLen;
    $("num-input").value         = "";
    numInput = "";
    hide("animal-preview");
  }

  renderGrade();
  atualizarPremio();
  atualizarBotao();
}

// ─── GRADE ANIMAIS ────────────────────────────────────────
function renderGrade() {
  const filtro = ($("filtro-input").value||"").toLowerCase();
  const el     = $("grade-animais");
  el.innerHTML = "";

  ANIMAIS.filter(a => a.nome.toLowerCase().includes(filtro)).forEach(a => {
    const btn = document.createElement("button");
    btn.className = "animal-card" + (animal?.id===a.id ? " selecionado" : "");
    btn.innerHTML = `
      ${animal?.id===a.id ? '<div class="check-badge">✓</div>' : ''}
      <span class="animal-card-emoji">${a.e}</span>
      <div class="animal-card-nome">${a.nome}</div>
      <div class="animal-card-dez">${a.dez[0]}–${a.dez[3]}</div>`;
    btn.onclick = () => selecionarAnimal(a);
    el.appendChild(btn);
  });
}

function selecionarAnimal(a) {
  animal = a;
  $("animal-sel-emoji").textContent = a.e;
  $("animal-sel-nome").textContent  = a.nome;
  $("animal-sel-dez").textContent   = "Dezenas: " + a.dez.join(", ");
  show("animal-selecionado");
  renderGrade();
  atualizarPremio();
  atualizarBotao();
}

function limparAnimal() {
  animal = null;
  hide("animal-selecionado");
  renderGrade();
  atualizarPremio();
  atualizarBotao();
}

// ─── NÚMERO ───────────────────────────────────────────────
function onNumInput() {
  const mod    = getMod();
  const maxLen = mod.id==="dezena"?2:mod.id==="centena"?3:4;
  numInput     = $("num-input").value.replace(/\D/g,"").slice(0, maxLen);
  $("num-input").value = numInput;

  // animal preview
  let aPreview = null;
  if (mod.id==="dezena"  && numInput.length===2) aPreview = byDez(numInput.padStart(2,"0"));
  if (mod.id==="centena" && numInput.length===3) aPreview = byDez(numInput.slice(-2));
  if (mod.id==="milhar"  && numInput.length===4) aPreview = byDez(numInput.slice(-2));

  if (aPreview) {
    $("preview-emoji").textContent = aPreview.e;
    $("preview-nome").textContent  = aPreview.nome;
    show("animal-preview");
  } else {
    hide("animal-preview");
  }

  atualizarPremio();
  atualizarBotao();
}

// ─── VALOR ────────────────────────────────────────────────
function renderVals() {
  const el = $("vals-grid");
  el.innerHTML = "";
  VALS.forEach(vv => {
    const btn = document.createElement("button");
    btn.className = "val-btn" + (valor===vv ? " ativo" : "");
    btn.textContent = "R$"+vv;
    btn.onclick = () => { valor = vv; $("valor-input").value = vv; renderVals(); atualizarPremio(); atualizarBotao(); };
    el.appendChild(btn);
  });
}

$("valor-input").addEventListener("input", function() {
  valor = this.value;
  // desmarcar botões rápidos
  document.querySelectorAll(".val-btn").forEach(b => b.classList.remove("ativo"));
  atualizarPremio();
  atualizarBotao();
});

function atualizarPremio() {
  const v   = getValor();
  const mod = getMod();
  const ok  = podeApostar();

  if (ok) {
    $("premio-txt").textContent = "R$ " + (v * mod.mult).toFixed(2);
    show("premio-box");
  } else {
    hide("premio-box");
  }

  toggle("erro-saldo", v > saldo && v > 0);
}

function atualizarBotao() {
  const btn = $("btn-apostar");
  if (podeApostar()) {
    btn.disabled = false;
    btn.textContent = "🎲 FAZER APOSTA";
  } else {
    btn.disabled = true;
    btn.textContent = "Preencha os campos acima";
  }
}

// ─── SORTEIO ──────────────────────────────────────────────
function lancar() {
  if (!podeApostar()) return;
  const v   = getValor();
  const mod = getMod();
  saldo = +(saldo - v).toFixed(2);
  atualizarSaldo();

  // esconder nav durante sorteio
  hide("nav");
  mostrarTela("sorteando");

  // montar bolas vazias
  const cont = $("bolas-container");
  cont.innerHTML = "";
  for (let i=0; i<5; i++) {
    const b = document.createElement("div");
    b.className = "bola";
    b.id = "bola-"+i;
    b.innerHTML = '<span class="bola-q">?</span>';
    cont.appendChild(b);
  }

  const nums = sortear();
  const aposta = {
    mod: mod.id,
    animalId: animal?.id,
    num: numInput.padStart(mod.id==="dezena"?2:mod.id==="centena"?3:4,"0"),
    valor: v, mult: mod.mult,
    modNome: mod.nome, animalObj: animal,
  };

  let delay = 0;
  nums.forEach((num, i) => {
    delay += 700 + i*220;
    setTimeout(() => revelarBola(i, num), delay-450);
  });

  setTimeout(() => {
    const idx    = checar(aposta, nums);
    const ganhou = idx >= 0;
    const premio = ganhou ? +(v * mod.mult).toFixed(2) : 0;
    if (ganhou) saldo = +(saldo + premio).toFixed(2);
    atualizarSaldo();

    const reg = { aposta, nums, ganhou, premio, premioIdx: idx };
    historico.unshift(reg);
    if (historico.length > 30) historico.pop();

    mostrarResultado(reg);
    show("nav");
  }, delay+600);
}

function revelarBola(i, num) {
  const a   = byDez(num.slice(-2));
  const el  = $("bola-"+i);
  el.classList.add("ativa");
  el.innerHTML = `
    <span class="bola-emoji">${a?.e||"?"}</span>
    <span class="bola-num">${num}</span>
    <span class="bola-premio">${i+1}º prêmio</span>`;
}

// ─── RESULTADO ────────────────────────────────────────────
function mostrarResultado(reg) {
  mostrarTela("resultado");

  const rh = $("res-header");
  rh.className = "res-header " + (reg.ganhou ? "ganhou" : "perdeu");
  $("res-icon").textContent   = reg.ganhou ? "🏆" : "😔";
  $("res-titulo").textContent = reg.ganhou ? "VOCÊ GANHOU!" : "Não foi dessa vez";
  $("res-titulo").style.color = reg.ganhou ? "#166534" : "#991b1b";

  if (reg.ganhou) {
    $("res-premio").textContent = "R$ " + reg.premio.toFixed(2);
    $("res-premio").style.color = "#166534";
    show("res-premio");
  } else { hide("res-premio"); }

  $("res-saldo").textContent = "Saldo: R$ " + saldo.toFixed(2);
  $("res-saldo").style.color = reg.ganhou ? "#166534" : "#991b1b";

  // Bolas
  const br = $("bolas-res");
  br.innerHTML = "";
  reg.nums.forEach((num, i) => {
    const a    = byDez(num.slice(-2));
    const dest = reg.ganhou && reg.premioIdx===i;
    const div  = document.createElement("div");
    div.className = "bola-res" + (dest ? " destaque" : "");
    div.innerHTML = `
      <div class="bola-premio">${i+1}º</div>
      <div class="bola-emoji">${a?.e}</div>
      <div class="bola-num-res" style="font-size:12px;font-weight:800;margin-top:2px">${num}</div>
      <div class="bola-premio">${a?.nome}</div>`;
    br.appendChild(div);
  });

  // Resumo
  const rr = $("resumo-rows");
  rr.innerHTML = "";
  const linhas = [
    ["Modalidade", reg.aposta.modNome],
    reg.aposta.animalObj ? ["Animal", reg.aposta.animalObj.e+" "+reg.aposta.animalObj.nome] : null,
    ["Apostado", "R$ "+reg.aposta.valor.toFixed(2)],
    reg.ganhou ? ["Prêmio", "R$ "+reg.premio.toFixed(2)] : null,
  ].filter(Boolean);
  linhas.forEach(([k,v]) => {
    rr.innerHTML += `<div class="resumo-row"><span class="resumo-key">${k}</span><span class="resumo-val">${v}</span></div>`;
  });
}

function resetar() {
  animal = null; numInput = "";
  hide("animal-selecionado");
  if ($("num-input")) $("num-input").value = "";
  hide("animal-preview");
  renderGrade();
  atualizarPremio();
  atualizarBotao();
  mostrarTela("form");
}

// ─── BICHOS ───────────────────────────────────────────────
function renderBichos() {
  const gb = $("grade-bichos");
  if (gb.children.length > 0) return; // já renderizado
  ANIMAIS.forEach(a => {
    const div = document.createElement("div");
    div.className = "bicho-card";
    div.innerHTML = `
      <span class="bicho-emoji">${a.e}</span>
      <div class="bicho-nome">${a.nome}</div>
      <div class="bicho-grupo">G.${a.id}</div>
      <div class="bicho-dezenas">${a.dez.map(d=>`<div class="dez-badge">${d}</div>`).join("")}</div>`;
    gb.appendChild(div);
  });

  const lm = $("lista-mods");
  MODS.forEach(m => {
    lm.innerHTML += `
      <div class="mod-card">
        <div>
          <div class="mod-card-nome">${m.nome}</div>
          <div class="mod-card-desc">${m.desc}</div>
        </div>
        <div class="mult-box">
          <span class="mult-paga">paga</span>
          <span class="mult-val">×${m.mult}</span>
        </div>
      </div>`;
  });
}

// ─── HISTÓRICO ────────────────────────────────────────────
function renderHistorico() {
  const el = $("lista-historico");
  el.innerHTML = "";
  const badge = $("hist-badge");

  if (historico.length === 0) {
    el.innerHTML = `<div class="card empty-hist">
      <span class="empty-emoji">🎲</span>
      <div class="empty-txt">Nenhuma aposta ainda</div>
      <button onclick="irApostar()" style="background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 22px;font-weight:700;font-size:14px">Apostar agora</button>
    </div>`;
    hide("hist-badge");
    return;
  }

  badge.textContent = historico.length;
  show("hist-badge");

  historico.forEach(h => {
    const numsHtml = h.nums.map(r => {
      const a = byDez(r.slice(-2));
      return `<span style="margin-right:5px">${a?.e}${r}</span>`;
    }).join("");

    el.innerHTML += `
      <div class="hist-card ${h.ganhou?'ganhou':'perdeu'}">
        <div class="hist-row">
          <div class="hist-left">
            <span style="font-size:20px">${h.ganhou?'🏆':'❌'}</span>
            <div>
              <div class="hist-mod">${h.aposta.modNome}${h.aposta.animalObj?' · '+h.aposta.animalObj.e+' '+h.aposta.animalObj.nome:''}</div>
              <div class="hist-nums">${numsHtml}</div>
            </div>
          </div>
          <div class="hist-right">
            <div class="hist-valor" style="color:${h.ganhou?'#166534':'#991b1b'}">${h.ganhou?'+R$'+h.premio.toFixed(2):'-R$'+h.aposta.valor.toFixed(2)}</div>
            <div class="hist-apostado">R$${h.aposta.valor.toFixed(2)}</div>
          </div>
        </div>
      </div>`;
  });
}

// ─── NAVEGAÇÃO ────────────────────────────────────────────
function mostrarTela(nome) {
  ["form","sorteando","resultado","bichos","historico"].forEach(t => {
    toggle("tela-"+t, t===nome);
  });
}

function setTab(t) {
  tab = t;
  ["apostar","bichos","historico"].forEach(id => {
    const btn = $("nav-"+id);
    if (id===t) btn.classList.add("ativo"); else btn.classList.remove("ativo");
  });

  if (t==="apostar") {
    mostrarTela("form");
    resetar();
  } else if (t==="bichos") {
    mostrarTela("bichos");
    renderBichos();
  } else if (t==="historico") {
    mostrarTela("historico");
    renderHistorico();
  }
  $("content").scrollTop = 0;
}

function irApostar() { setTab("apostar"); }

// ─── INIT ─────────────────────────────────────────────────
(function init() {
  renderVals();
  aplicarMod();
  renderGrade();
  atualizarSaldo();
  atualizarBotao();
})();
</script>
</body>
</html>
